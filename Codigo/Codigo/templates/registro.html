```html
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrarse | tutrabajo</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='Css/styles.css') }}">

    <style>

        body {
            background-color: #f3f2ef;
            font-family: Arial, Helvetica, sans-serif;
            margin: 0;
            padding: 0;
        }

        .auth-wrapper {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 50px 20px;
        }

        .auth-card {
            background: white;
            width: 100%;
            max-width: 520px;
            padding: 40px;
            border-radius: 14px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.08);
        }

        .auth-card h2 {
            margin-bottom: 10px;
            color: #1d2226;
            font-size: 32px;
        }

        .auth-card p {
            color: #666;
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #333;
        }

        .form-group input,
        .form-group select {
            width: 100%;
            padding: 13px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 15px;
            transition: 0.2s;
            box-sizing: border-box;
        }

        .form-group input:focus,
        .form-group select:focus {
            outline: none;
            border-color: #0a66c2;
            box-shadow: 0 0 0 3px rgba(10,102,194,0.15);
        }

        .extra-fields {
            margin-top: 15px;
            padding-top: 10px;
        }

        .btn-primary-auth {
            width: 100%;
            background: #0a66c2;
            color: white;
            border: none;
            padding: 14px;
            border-radius: 30px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
            margin-top: 10px;
        }

        .btn-primary-auth:hover {
            background: #004182;
        }

        .auth-footer {
            margin-top: 25px;
            text-align: center;
            color: #666;
        }

        .auth-footer a {
            color: #0a66c2;
            text-decoration: none;
            font-weight: bold;
        }

    </style>

</head>

<body>

    <!-- HEADER -->
    <header class="main-header">

        <div class="header-container">

            <div class="logo-area">

                <a href="/"
                   style="text-decoration: none; display: flex; align-items: center; gap: 10px;">

                    <svg width="34"
                         height="34"
                         viewBox="0 0 24 24"
                         fill="none">

                        <rect width="24"
                              height="24"
                              rx="4"
                              fill="#0077b5"/>

                        <path d="M7 9H10V18H7V9Z"
                              fill="white"/>

                        <circle cx="8.5"
                                cy="6.5"
                                r="2"
                                fill="white"/>

                        <path d="M12 9H15V11.5C15.5 10 16.5 9 18 9C20 9 21 10.5 21 13V18H18V13.5C18 12.5 17.5 11.5 16.5 11.5C15.5 11.5 15 12.5 15 13.5V18H12V9Z"
                              fill="white"/>

                    </svg>

                    <span class="brand-name">
                        tutrabajo
                    </span>

                </a>

            </div>

        </div>

    </header>


    <!-- FORMULARIO -->
    <div class="auth-wrapper">

        <div class="auth-card">

            <h2>
                Registrarse
            </h2>

            <p>
                Crea tu cuenta y comienza a conectar oportunidades.
            </p>

            <form action="/usuario/crear"
                  method="POST">

                <!-- DATOS USUARIO -->

                <div class="form-group">

                    <label for="nombre">
                        Nombre completo
                    </label>

                    <input type="text"
                           id="nombre"
                           name="nombre"
                           required>

                </div>


                <div class="form-group">

                    <label for="correo">
                        Correo electrónico
                    </label>

                    <input type="email"
                           id="correo"
                           name="correo"
                           required>

                </div>


                <div class="form-group">

                    <label for="numero">
                        Número de teléfono
                    </label>

                    <input type="tel"
                           id="numero"
                           name="numero"
                           required>

                </div>


                <div class="form-group">

                    <label for="tipoUsuario">
                        Tipo de perfil
                    </label>

                    <select id="tipoUsuario"
                            name="tipoUsuario"
                            required
                            onchange="mostrarCamposExtra()">

                        <option value="candidato">
                            Candidato (Busco empleo)
                        </option>

                        <option value="delegado">
                            Delegado (Publico ofertas)
                        </option>

                    </select>

                </div>


                <!-- CAMPOS CANDIDATO -->

                <div id="campos-candidato"
                     class="extra-fields">

                    <div class="form-group">

                        <label for="profesion">
                            Profesión
                        </label>

                        <input type="text"
                               id="profesion"
                               name="profesion">

                    </div>

                </div>


                <!-- CAMPOS DELEGADO -->

                <div id="campos-delegado"
                     class="extra-fields"
                     style="display: none;">

                    <div class="form-group">

                        <label for="razonSocial">
                            Razón social de la empresa
                        </label>

                        <input type="text"
                               id="razonSocial"
                               name="razonSocial">

                    </div>


                    <div class="form-group">

                        <label for="correoContacto">
                            Correo de contacto
                        </label>

                        <input type="email"
                               id="correoContacto"
                               name="correoContacto">

                    </div>


                    <div class="form-group">

                        <label for="direccion">
                            Dirección
                        </label>

                        <input type="text"
                               id="direccion"
                               name="direccion">

                    </div>

                </div>


                <div class="form-group">

                    <label for="password">
                        Contraseña
                    </label>

                    <input type="password"
                           id="password"
                           name="password"
                           minlength="6"
                           required>

                </div>


                <button type="submit"
                        class="btn-primary-auth">

                    Crear cuenta

                </button>

            </form>


            <div class="auth-footer">

                ¿Ya tienes cuenta?

                <a href="/login">
                    Inicia sesión
                </a>

            </div>

        </div>

    </div>


    <script>

        function mostrarCamposExtra() {

            const tipo = document.getElementById("tipoUsuario").value;

            const candidato =
                document.getElementById("campos-candidato");

            const delegado =
                document.getElementById("campos-delegado");

            if (tipo === "delegado") {

                delegado.style.display = "block";
                candidato.style.display = "none";

            } else {

                delegado.style.display = "none";
                candidato.style.display = "block";

            }
        }

        mostrarCamposExtra();

    </script>

</body>
</html>
```
